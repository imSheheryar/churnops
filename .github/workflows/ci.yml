name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  test:
    name: Tests and pipeline smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Pipeline smoke run (2k rows, no promotion)
        run: churnops pipeline --sample 2000 --no-promote
      - name: API contract tests against the trained model
        run: pytest -q tests/test_api.py
      - name: Publish metrics to the job summary
        if: always()
        run: python scripts/ci_summary.py
      - name: Package artefacts for the docker job
        run: |
          tar -czf model-artifacts.tgz \
            artifacts/model.joblib artifacts/model_meta.json \
            artifacts/reference_stats.json artifacts/reference_sample.parquet \
            artifacts/plots reports
      - uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: model-artifacts.tgz
          retention-days: 7

  docker:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-artifacts
      - name: Restore artefacts
        run: tar -xzf model-artifacts.tgz
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: churnops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and check health
        run: |
          docker run -d --name churnops -p 8000:8000 churnops:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | tee health.json
          curl -sf -X POST http://localhost:8000/predict \
            -H 'content-type: application/json' \
            -d @scripts/payload_example.json | tee prediction.json
          docker logs churnops
          docker rm -f churnops
