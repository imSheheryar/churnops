[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnops"
version = "0.1.0"
description = "ChurnOps - a production-grade MLOps reference platform for customer churn prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sheheryar Yousaf" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "mlflow==2.17.2",
  "sqlalchemy>=2.0,<2.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "matplotlib>=3.9",
  "scipy>=1.13",
  "joblib>=1.4",
  "jinja2>=3.1",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
churnops = "churnops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
